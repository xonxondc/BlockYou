<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockYou</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .logo span {
      color: #ff4444;
    }

    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #333;
      border-radius: 24px;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background: #ff4444;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .section {
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #1f1f1f;
    }

    .option:last-child {
      border-bottom: none;
    }

    .option label {
      font-size: 13.5px;
      color: #ddd;
      cursor: pointer;
    }

    .option input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff4444;
      cursor: pointer;
    }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #1f1f1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reset {
      background: none;
      border: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 0;
    }

    .reset:hover {
      color: #aaa;
    }

    .status {
      font-size: 12px;
      color: #666;
    }

    .status.active {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Block<span>You</span></div>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="blockedCount">0</div>
      <div class="stat-label">Ads blocked</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="timeSaved">0s</div>
      <div class="stat-label">Time saved</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Features</div>
    <div class="option">
      <label for="skipAds">Auto skip video ads</label>
      <input type="checkbox" id="skipAds" checked>
    </div>
    <div class="option">
      <label for="muteAds">Mute ads while skipping</label>
      <input type="checkbox" id="muteAds" checked>
    </div>
    <div class="option">
      <label for="hideSponsored">Hide sponsored videos</label>
      <input type="checkbox" id="hideSponsored" checked>
    </div>
    <div class="option">
      <label for="shortsClean">Clean Shorts</label>
      <input type="checkbox" id="shortsClean" checked>
    </div>
    <div class="option">
      <label for="blockPremium">Block Premium prompts</label>
      <input type="checkbox" id="blockPremium" checked>
    </div>
    <div class="option">
      <label for="ultra">Ultra aggressive mode</label>
      <input type="checkbox" id="ultra">
    </div>
  </div>

  <div class="footer">
    <button class="reset" id="resetStats">Reset stats</button>
    <div class="status active" id="status">Active</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
